<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <header>
    <h1>Alertosaurus</h1>
    <div id="endpoint-info"></div>
  </header>
  <nav id="tabs">
    <button class="tab active" data-tab="notifications">Notifications</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>
  <main>
    <div id="tab-notifications">
      <div id="notification-list"></div>
      <div id="empty-state" class="hidden">No notifications yet. Send one with <code>roar "hello"</code></div>
    </div>
    <div id="tab-settings" class="hidden">
      <div class="settings-group">
        <label class="setting-row">
          <div class="setting-info">
            <div class="setting-label">Sleep Timer</div>
            <div class="setting-description">How long the pet stays awake after the last notification before falling asleep.</div>
          </div>
          <select id="sleep-timer-select" class="setting-select">
            <option value="30000">30 seconds</option>
            <option value="60000">1 minute</option>
            <option value="120000">2 minutes</option>
            <option value="300000">5 minutes</option>
          </select>
        </label>
        <label class="setting-row">
          <div class="setting-info">
            <div class="setting-label">Gravity</div>
            <div class="setting-description">Drop the pet onto surfaces after dragging. Disable if dropping doesn't work well on your system.</div>
          </div>
          <input type="checkbox" id="gravity-toggle" class="toggle">
        </label>
      </div>
    </div>
  </main>
  <footer>
    <button id="clear-btn">Clear History</button>
    <span id="version-info"></span>
    <button id="quit-btn">Quit</button>
  </footer>
  <script type="module" src="hub.js"></script>
</body>
</html>
